<div class="expense-dashboard">

  <app-information-filter title="Filtrar categorias" description="Selecione as categorias que deseja visualizar"
    [items]="categoryOptions" [selectedIds]="selectedCategories()"
    (selectedIdsChange)="selectedCategories.set($event)"></app-information-filter>

  <app-dashboard-summary [items]="filteredCategoryOptions" [competenceInitial]="competenceInitial"
    [competenceEnd]="competenceEnd">
  </app-dashboard-summary>

  <div class="content-grid">

    <app-dashboard-overview title="Despesas por categoria" description="Distribuição dos gastos"
      [items]="filteredCategoryOptions" chartType="bar">
    </app-dashboard-overview>

    <app-dashboard-main title="Maiores despesas" subtitle="Despesas com maiores valores"
      [events]="filteredCategoryEvent" />

  </div>

  <div class="categories-container">

    <app-dashboard-detail [events]="filteredCategoryOptions" />

    <div class="empty-state full" *ngIf="!categories.length">

      Nenhuma categoria selecionada.

    </div>

  </div>

</div>
